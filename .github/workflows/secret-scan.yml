name: Secret scan

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          set -euo pipefail
          version=8.30.1
          archive="gitleaks_${version}_linux_x64.tar.gz"
          base="https://github.com/gitleaks/gitleaks/releases/download/v${version}"
          work="$(mktemp -d)"
          curl -sSL "${base}/${archive}" -o "${work}/${archive}"
          curl -sSL "${base}/gitleaks_${version}_checksums.txt" -o "${work}/checksums.txt"
          (cd "${work}" && sha256sum -c checksums.txt --ignore-missing)
          tar -xzf "${work}/${archive}" -C "${work}" gitleaks
          sudo install -m 0755 "${work}/gitleaks" /usr/local/bin/gitleaks
          gitleaks version

      - name: Scan git history
        run: gitleaks detect --source . --config .gitleaks.toml --redact --verbose --exit-code 1
