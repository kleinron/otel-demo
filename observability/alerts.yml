# Provider-neutral alert catalog for the otel-demo experiment.
# A generator produces Grafana alert-rule provisioning files from this file.
# See observability/README.md. CloudWatch alarms are not generated.
#
# Thresholds are initial values to tune after baseline traffic.
# severity: critical | warning | informational
# informational alerts record a signal and must not page.
# The 5xx numerator is HTTP status 500-599 only. HTTP 409 is an allocation
# conflict and is counted only by inventory-allocation-conflict-rate.
# Database-timeout and payment-delay fault injection exist and default to off.
#
# missing_data is how a rule treats a window with no datapoints.
# Ratio (5xx and outbound error) and latency (p99) rules set not_breaching:
# a stopped load generator or a quiet period produces no datapoints and must
# not count as a failure. Count-based rules (database timeouts, payments
# stuck) also set not_breaching. request-rate-zero sets breaching: no data
# means a dead load generator or broken routing.
# not_breaching maps to Grafana noDataState OK. breaching maps to Alerting.

version: 1

alerts:
  - name: shop-add-to-cart-5xx-rate
    signal: metric
    scope:
      service: shop
      operation: add-to-cart
    condition: 'percentage of responses with HTTP status 500-599 is above the threshold; the numerator is 500-599 only, so HTTP 409 is excluded'
    threshold: '2%'
    window: '5m'
    min_request_count: 20
    missing_data: not_breaching
    severity: critical
    why: 'A sustained server-error rate on add-to-cart means shoppers cannot fill a cart, which stops the funnel before checkout.'

  - name: shop-remove-from-cart-5xx-rate
    signal: metric
    scope:
      service: shop
      operation: remove-from-cart
    condition: 'percentage of responses with HTTP status 500-599 is above the threshold; the numerator is 500-599 only, so HTTP 409 is excluded'
    threshold: '2%'
    window: '5m'
    min_request_count: 20
    missing_data: not_breaching
    severity: critical
    why: 'Server errors on remove-from-cart leave items in the cart after the shopper tried to drop them, so checkout sees a cart they did not intend.'

  - name: shop-checkout-5xx-rate
    signal: metric
    scope:
      service: shop
      operation: checkout
    condition: 'percentage of responses with HTTP status 500-599 is above the threshold; the numerator is 500-599 only, so HTTP 409 is excluded'
    threshold: '2%'
    window: '5m'
    min_request_count: 10
    missing_data: not_breaching
    severity: critical
    why: 'Checkout is the customer-facing call that places the order, so a 5xx rate here means orders are failing across shop, inventory, and payment.'

  - name: shop-order-status-5xx-rate
    signal: metric
    scope:
      service: shop
      operation: order-status
    condition: 'percentage of responses with HTTP status 500-599 is above the threshold; the numerator is 500-599 only, so HTTP 409 is excluded'
    threshold: '2%'
    window: '5m'
    min_request_count: 20
    missing_data: not_breaching
    severity: critical
    why: 'Order status is how a customer sees whether checkout finished, and server errors here hide a stuck payment or delivery.'

  - name: shop-add-to-cart-p99-latency
    signal: metric
    scope:
      service: shop
      operation: add-to-cart
    condition: 'p99 server-side latency is above the threshold'
    threshold: '800ms'
    window: '5m'
    min_request_count: 20
    missing_data: not_breaching
    severity: warning
    why: "Add-to-cart is a short shop call, and a p99 above 800ms is the initial signal that this path is slower than the experiment's latency budget."

  - name: shop-checkout-p99-latency
    signal: metric
    scope:
      service: shop
      operation: checkout
    condition: 'p99 server-side latency is above the threshold'
    threshold: '2s'
    window: '15m'
    min_request_count: 30
    missing_data: not_breaching
    severity: warning
    why: 'Checkout is low volume, so a p99 over a short window is just the slowest request.'

  - name: inventory-5xx-rate
    signal: metric
    scope:
      service: inventory
      operation: all
    condition: 'percentage of responses with HTTP status 500-599 is above the threshold; the numerator is 500-599 only, so HTTP 409 is excluded'
    threshold: '2%'
    window: '5m'
    min_request_count: 20
    missing_data: not_breaching
    severity: critical
    why: 'A sustained server-error rate on inventory means stock checks and allocation are failing, and HTTP 409 allocation conflicts stay out of this numerator.'

  - name: payment-5xx-rate
    signal: metric
    scope:
      service: payment
      operation: all
    condition: 'percentage of responses with HTTP status 500-599 is above the threshold; the numerator is 500-599 only, so HTTP 409 is excluded'
    threshold: '2%'
    window: '5m'
    min_request_count: 20
    missing_data: not_breaching
    severity: critical
    why: 'A sustained server-error rate on payment means charges are failing before checkout can finish.'

  - name: delivery-5xx-rate
    signal: metric
    scope:
      service: delivery
      operation: all
    condition: 'percentage of responses with HTTP status 500-599 is above the threshold; the numerator is 500-599 only, so HTTP 409 is excluded'
    threshold: '2%'
    window: '5m'
    min_request_count: 20
    missing_data: not_breaching
    severity: critical
    why: 'A sustained server-error rate on delivery means paid orders are not being handed off.'

  - name: inventory-p99-latency
    signal: metric
    scope:
      service: inventory
      operation: all
    condition: 'p99 server-side latency is above the threshold'
    threshold: '500ms'
    window: '10m'
    min_request_count: 20
    missing_data: not_breaching
    severity: warning
    why: 'Inventory is on the cart and checkout path, and a server-side p99 above 500ms is the initial signal that stock calls are slower than the latency budget.'

  - name: payment-p99-latency
    signal: metric
    scope:
      service: payment
      operation: all
    condition: 'p99 server-side latency is above the threshold'
    threshold: '1s'
    window: '10m'
    min_request_count: 20
    missing_data: not_breaching
    severity: warning
    why: 'Payment is on the checkout path, and a server-side p99 above 1s is the initial signal that charges are slower than the latency budget.'

  - name: delivery-p99-latency
    signal: metric
    scope:
      service: delivery
      operation: all
    condition: 'p99 server-side latency is above the threshold'
    threshold: '1s'
    window: '10m'
    min_request_count: 20
    missing_data: not_breaching
    severity: warning
    why: 'Delivery runs after payment, and a server-side p99 above 1s is the initial signal that handoff is slower than the latency budget.'

  - name: shop-outbound-error-rate
    signal: metric
    scope:
      service: shop
      operation: outbound
    condition: 'percentage of outbound calls to other services and to the service database that end in error is above the threshold'
    threshold: '5%'
    window: '5m'
    min_request_count: 20
    missing_data: not_breaching
    severity: warning
    why: 'Shop calls inventory, payment, and delivery, plus its own database, and an outbound error rate above 5% means those calls are failing.'

  - name: inventory-outbound-error-rate
    signal: metric
    scope:
      service: inventory
      operation: outbound
    condition: 'percentage of outbound calls to other services and to the service database that end in error is above the threshold'
    threshold: '5%'
    window: '5m'
    min_request_count: 20
    missing_data: not_breaching
    severity: warning
    why: 'Inventory calls its own database, and an outbound error rate above 5% means those calls are failing even when the inbound 5xx rate stays under its threshold.'

  - name: payment-outbound-error-rate
    signal: metric
    scope:
      service: payment
      operation: outbound
    condition: 'percentage of outbound calls to other services and to the service database that end in error is above the threshold'
    threshold: '5%'
    window: '5m'
    min_request_count: 20
    missing_data: not_breaching
    severity: warning
    why: 'Payment calls its own database, and an outbound error rate above 5% means those calls are failing even when the inbound 5xx rate stays under its threshold.'

  - name: delivery-outbound-error-rate
    signal: metric
    scope:
      service: delivery
      operation: outbound
    condition: 'percentage of outbound calls to other services and to the service database that end in error is above the threshold'
    threshold: '5%'
    window: '5m'
    min_request_count: 20
    missing_data: not_breaching
    severity: warning
    why: 'Delivery calls its own database, and an outbound error rate above 5% means those calls are failing even when the inbound 5xx rate stays under its threshold.'

  - name: shop-db-timeout-count
    signal: metric
    scope:
      service: shop
      operation: database
    condition: 'count of timed-out database client operations is above the threshold'
    threshold: '0'
    window: '5m'
    missing_data: not_breaching
    severity: warning
    why: 'Timeouts on the shop database stall cart reads and writes, and they are unexpected while database-timeout injection is left at its default of off.'

  - name: inventory-db-timeout-count
    signal: metric
    scope:
      service: inventory
      operation: database
    condition: 'count of timed-out database client operations is above the threshold'
    threshold: '0'
    window: '5m'
    missing_data: not_breaching
    severity: warning
    why: 'Timeouts on the inventory database stall allocation and stock checks, and they are unexpected while database-timeout injection is left at its default of off.'

  - name: payment-db-timeout-count
    signal: metric
    scope:
      service: payment
      operation: database
    condition: 'count of timed-out database client operations is above the threshold'
    threshold: '0'
    window: '5m'
    missing_data: not_breaching
    severity: warning
    why: 'Timeouts on the payment database can leave a charge unknown or authorized without capture, and they are unexpected while database-timeout injection is left at its default of off.'

  - name: delivery-db-timeout-count
    signal: metric
    scope:
      service: delivery
      operation: database
    condition: 'count of timed-out database client operations is above the threshold'
    threshold: '0'
    window: '5m'
    missing_data: not_breaching
    severity: warning
    why: 'Timeouts on the delivery database stall order progress after payment, and they are unexpected while database-timeout injection is left at its default of off.'

  - name: payment-stuck-unknown
    signal: metric
    scope:
      service: payment
      operation: resolve-payment
    condition: 'count of payments in state unknown for longer than the threshold is at least 1'
    threshold: '2m'
    window: '5m'
    missing_data: not_breaching
    severity: critical
    why: 'A payment left in unknown has an unresolved charge outcome, and retrying it blindly can double-charge the customer.'

  - name: payment-stuck-authorized-not-captured
    signal: metric
    scope:
      service: payment
      operation: capture
    condition: 'count of payments in state authorized with no capture for longer than the threshold is at least 1'
    threshold: '2m'
    window: '5m'
    missing_data: not_breaching
    severity: critical
    why: 'A payment left authorized without capture holds customer funds without completing the order.'

  - name: inventory-allocation-conflict-rate
    signal: metric
    scope:
      service: inventory
      operation: allocate
    group_by: sku_category
    condition: 'percentage of allocation attempts that end in a conflict is above the threshold, grouped by SKU category; HTTP 409 is counted here and is excluded from every 5xx numerator'
    threshold: '10%'
    window: '15m'
    severity: informational
    why: 'Allocation conflicts are expected contention inside a SKU category, so this rate is informational and the HTTP 409 responses must not count toward the 5xx alarms.'

  - name: inventory-out-of-stock-rate
    signal: metric
    scope:
      service: inventory
      operation: allocate
    group_by: sku_category
    condition: 'percentage of allocation attempts that end as out-of-stock is above the threshold, grouped by SKU category'
    threshold: '10%'
    window: '15m'
    severity: informational
    why: 'Out-of-stock by SKU category is a capacity signal for the catalog under test, and it stays informational so it does not page or consume the 5xx budget.'

  - name: load-generator-exceeds-caps
    signal: metric
    scope:
      service: load-generator
      operation: generate-load
    condition: 'request rate or in-flight concurrency is above the threshold'
    threshold: 'configured cap for that limit'
    window: '5m'
    severity: warning
    why: 'A load generator running above its configured rate or concurrency caps makes latency and error alerts describe an overload rather than the intended experiment.'

  - name: request-rate-zero
    signal: metric
    scope:
      service: shop
      operation: all
    condition: 'total customer-facing request count is zero'
    threshold: '0 requests'
    window: '10m'
    missing_data: breaching
    severity: warning
    why: 'A window with zero customer-facing shop requests flags a dead runner or broken routing, so a silent system is not mistaken for a healthy one; a known runner restart or the warm-up before the first spike is an expected false positive to record when scoring.'

  - name: experiment-budget
    signal: metric
    scope:
      service: experiment
      operation: budget
    retain_on_teardown: true
    condition: 'actual monthly spend or forecasted month-end spend is above the threshold'
    threshold: '100% of the configured experiment budget'
    window: 'billing-month'
    severity: warning
    why: 'This AWS Budgets alert is the cost backstop for the experiment, and it stays in place after the workload is destroyed.'

  - name: cloudwatch-log-ingestion-volume
    signal: metric
    scope:
      service: experiment
      operation: log-ingestion
    condition: 'cumulative CloudWatch Logs ingested since the run started is above the threshold'
    threshold: '3 GB cumulative; a rate over ~40 MB/hour is the early signal'
    window: '72h'
    severity: warning
    why: 'Runaway log volume is the largest cost driver and the High scenario exceeds the $75 cap; 3 GB cumulative is above the 1-2 GB the agreed load profile should produce.'
